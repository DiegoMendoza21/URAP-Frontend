# Verifica cada PR y cada cambio en main: CONTRIBUTING.md, «main siempre en verde».
# Las acciones van fijadas por SHA, en versiones con más de dos semanas, igual que las
# dependencias del proyecto.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Formato, lint y compilación
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Formato (Prettier)
        run: npm run format:revisar

      - name: Lint (ESLint)
        run: npm run lint

      # La compilación no necesita URL_API: solo `dev` y `start` la exigen.
      - name: Compilación
        run: npm run build
